name: Lot 0 verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Pmobile=false :shared:jvmTest --console=plain
      - run: python3 tools/generate_tom.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-test-reports
          path: shared/build/reports/tests/jvmTest
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew :composeApp:assembleDebug :shared:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build iOS simulator app
        run: xcodebuild -project iosApp/TomTune.xcodeproj -scheme TomTune -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
