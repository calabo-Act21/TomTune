<body>
<div class="shell">
<header><strong>TomTune</strong><small>Maquette · audio simulé</small></header>
<main id="screen"></main>
<aside class="footer"><details><summary>Options de démonstration</summary><button data-action="demo">Charger un kit d’exemple</button><button data-action="fresh">Voir le premier lancement</button></details></aside>
</div>
<script>
const screen = document.querySelector('#screen');
const storageKey = 'tomtune-wireframe-v1';
const names = ['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const sizes = {rack:[8,10,12,13,14], floor:[14,15,16,18], snare:[12,13,14,15], kick:[18,20,22,24,26]};
const labels = {rack:'Rack tom', floor:'Floor tom', snare:'Caisse claire', kick:'Grosse caisse'};
const kitsKey = 'tomtune-wireframe-kits-v2';
function loadKits(){
  try {
    const stored = JSON.parse(localStorage.getItem(kitsKey));
    if(stored?.kits?.length) return stored;
    const previous = JSON.parse(localStorage.getItem(storageKey));
    if(Array.isArray(previous)) return {current:'previous', kits:[{id:'previous',name:'Mon kit',drums:previous}]};
  } catch {}
  return {current:null,kits:[]};
}
let {current:currentKitId,kits} = loadKits();
let kit = (kits.find(entry=>entry.id===currentKitId) ?? kits[0])?.drums ?? null;
let draftName = '';
let editingKitId = null;
let draftCountCache = new Map();
let draft, selected, setupBack, from, returnTo, target, head, pass, lugIndex, refsDraft, readDraft, checkIndex, order, checked, message;
let view = kit ? 'home' : 'welcome';
let sessionMeasure = null;
let correctionRound = 0;
let demoMode = false;
const suggest = drum => drum.type === 'snare' ? 55 : drum.type === 'kick' ? 35 : ({8:53,10:50,12:47,13:45,14:43,15:40,16:38,18:36}[drum.diameter] ?? 43);
const label = drum => drum.type === 'rack' || drum.type === 'floor' ? labels[drum.type]+' '+drum.diameter+'″' : labels[drum.type];
const isTom = drum => drum.type === 'rack' || drum.type === 'floor';
const note = midi => names[midi % 12]+' '+(Math.floor(midi/12)-1);
const hz = midi => 440 * Math.pow(2,(midi-69)/12);
const hertz = value => Math.round(value)+' Hz';
const cents = (measurement, reference) => Math.round((measurement-reference)*100);
const delta = (measurement, reference) => (cents(measurement,reference)>0?'+':'')+cents(measurement,reference)+' cents';
const measures = (measurement, reference) => measurement == null ? 'À mesurer' : note(Math.round(measurement))+(reference == null ? '' : ' · '+delta(measurement,reference));
const find = id => kit.find(drum=>drum.id===id);
const save = () => {
  if(demoMode)return false;
  try{localStorage.setItem(kitsKey,JSON.stringify({current:currentKitId,kits}));return true}catch{return false}
};
const escapeText = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const btn = (action, text, primary=false, value='') => '<button type="button" data-action="'+action+'" data-value="'+value+'"'+(primary?' class="primary"':'')+'>'+text+'</button>';
const back = (action,text='Retour') => '<div class="back">'+btn(action,'← '+text)+'</div>';
const actions = (...buttons) => '<div class="actions">'+buttons.join('')+'</div>';
const panel = content => '<div class="panel">'+content+'</div>';
const title = (text, desc='') => '<h1 tabindex="-1">'+text+'</h1>'+(desc?'<p class="muted">'+desc+'</p>':'');
const opts = (values, value, format=x=>x) => values.map(x=>'<option value="'+x+'"'+(x===value?' selected':'')+'>'+format(x)+'</option>').join('');
const noteOptions = value => opts(Array.from({length:49},(_,index)=>index+28),value,note);
const progress = fraction => '<div class="bar" aria-hidden="true"><span style="width:'+100*fraction+'%"></span></div>';
function defaultLugs(diameter){return diameter<=10?5:diameter<=14?6:8}
function makeDrum(type, index, diameter){
  return {id:type+index,type,diameter,lugs:type==='snare'?10:defaultLugs(diameter),ref:null,last:null,tuned:false};
}
function initialKit(){
  return [makeDrum('rack',1,10),makeDrum('floor',1,16),makeDrum('snare',1,14),makeDrum('kick',1,22)];
}
function editKit(create=false){
  setupBack = view;
  const entry = !create && !demoMode ? kits.find(item=>item.id===currentKitId) : null;
  editingKitId = entry?.id ?? null;
  draft = structuredClone(create ? initialKit() : kit ?? initialKit());
  draftName = entry?.name ?? '';
  draftCountCache = new Map(draft.map(drum=>[drum.id,drum]));
  show('setup');
}
function setCount(type, count){
  const retained = draft.filter(drum=>drum.type!==type);
  const diameters = type==='rack'?[10,12,13,14]:[16,18,14,15];
  for(let index=1;index<=count;index++){
    const id=type+index;
    if(!draftCountCache.has(id)) draftCountCache.set(id,makeDrum(type,index,diameters[(index-1)%diameters.length]));
    retained.push(draftCountCache.get(id));
  }
  draft=retained;
}
function stage(drums, interactive=false, results=false){
  const racks=drums.filter(drum=>drum.type==='rack');
  const floors=drums.filter(drum=>drum.type==='floor');
  const rackRows=Math.ceil(racks.length/3);
  const front=166+Math.max(0,rackRows-1)*64;
  const extraFloors=Math.max(0,Math.floor((floors.length-1)/2),floors.length>=2?1:0);
  const height=Math.max(370,front+180+extraFloors*78);
  const positions=new Map();
  positions.set('kick1',[50,front-14,32,85,35,1]);
  racks.forEach((drum,index)=>{
    const row=Math.floor(index/3);
    const count=Math.min(3,racks.length-row*3);
    const offset=index%3-(count-1)/2;
    positions.set(drum.id,[50+offset*26,102+row*62+Math.abs(offset)*9,21+(drum.diameter-10)*.55,49,25,2+row]);
  });
  positions.set('snare1',[49,front+75,26,59,23,10]);
  floors.forEach((drum,index)=>{
    const right=index<2 || (index>=4 && index%2===0);
    const row=index<2?index:index===2?0:Math.floor(index/2);
    const x=right?(row%2===0?82:79):(row%2===0?19:21);
    positions.set(drum.id,[x,front+62+row*78,27+(drum.diameter-16)*.7,61,42,11+row]);
  });
  return '<div class="kit-stage" style="--stage-height:'+height+'px" aria-label="Kit en perspective depuis le tabouret"><div class="stage-rug" aria-hidden="true"></div>'+
    drums.map(drum=>{
      const [x,y,w,h,depth,layer]=positions.get(drum.id);
      const tag=interactive?'button':'div';
      const style='left:'+x+'%;top:'+100*y/height+'%;width:'+w+'%;height:'+h+'px;--depth:'+depth+'px;z-index:'+layer;
      const short=drum.type==='snare'?'Caisse claire':drum.type==='kick'?'Grosse caisse':drum.diameter+'″';
      const result=results?' · Référence '+(drum.ref==null?'—':note(drum.ref))+' · Mesure '+(checked[drum.id]==null?'—':note(Math.round(checked[drum.id]))):'';
      const caption='<span class="stage-skin"><strong>'+short+'</strong>'+(results?'<span>'+ (drum.ref==null?'—':note(drum.ref))+' / '+(checked[drum.id]==null?'—':note(Math.round(checked[drum.id])))+'</span>':'')+'</span>';
      return '<'+tag+' class="drum" data-type="'+drum.type+'" style="'+style+'"'+(interactive?' data-action="open-drum" data-value="'+drum.id+'" aria-label="'+label(drum)+result+'"':'')+'><span class="stage-shell" aria-hidden="true"></span>'+caption+'</'+tag+'>';
    }).join('')+'<span class="seat" aria-hidden="true"></span></div>';
}
function kitToolbar(){
  const options = kits.map(entry=>'<option value="'+escapeText(entry.id)+'"'+(!demoMode && entry.id===currentKitId?' selected':'')+'>'+escapeText(entry.name)+'</option>').join('');
  return '<div class="kit-toolbar"><label class="stack">Kit courant<select data-kit>'+
    (demoMode?'<option value="" selected>Kit d’exemple</option>':'')+options+
    '</select></label><details class="kit-menu"><summary aria-label="Menu du kit">☰</summary><nav aria-label="Actions du kit">'+
    btn('check','Contrôle de l’accordage')+btn('references','Notes de référence')+btn('edit','Modifier le kit')+btn('new-kit','Créer un kit')+
    '</nav></details></div>';
}
let samples=[];
let simulatedHits=0;
let unstable=false;
let lastHit=null;
let captureMeasure=null;
let previousCheck=null;
let lugMeasurements=[];
const stepsForHead = () => target+12*Math.log2(head===0?1.5:1.85);
const headFrequency = () => hertz(hz(stepsForHead()));
const sampleSpread = values => Math.max(...values)-Math.min(...values);
function resetMeasurement(){
  samples=[];
  lastHit=null;
  simulatedHits=0;
  unstable=false;
}
function acceptHit(pitch){
  lastHit=pitch;
  // Pitches use semitones so distances are comparable across the kit.
  const next=[...samples,pitch];
  unstable=sampleSpread(next)>.180001;
  samples=unstable?[pitch]:next.slice(-5);
  const clear=samples.length>=3 && sampleSpread(samples)<=.080001;
  const consistent=samples.length===5;
  return clear||consistent?samples.reduce((sum,value)=>sum+value,0)/samples.length:null;
}
function simulateHit(base, pattern=0){
  const offsets=[[0,.02,-.02],[.43,0,.025,-.02],[-.07,.06,-.05,.07,0]][pattern%3];
  const offset=offsets[simulatedHits++]??0;
  return acceptHit(base+offset);
}
function measurementStatus(){
  if(unstable) return 'Frappes trop éloignées. Continue à frapper au même endroit.';
  if(samples.length) return 'Stabilité en cours. Continue à frapper au même endroit.';
  return 'En attente de frappes.';
}
function formatPitch(pitch, mode){
  return mode==='lug'?hertz(hz(pitch)):note(Math.round(pitch))+' · '+hertz(hz(pitch));
}
function feedbackCard({reference=null, measured=null, mode='drum'}={}){
  const pitch=measured??lastHit;
  const confirmed=measured!=null;
  const state=confirmed?'Mesure validée':unstable?'Frappe captée · série instable':pitch==null?'En attente de frappe':'Frappe captée · mesure provisoire';
  const style=confirmed?'confirmed':unstable?'unstable detected':pitch==null?'':'detected';
  const offset=pitch!=null && reference!=null?cents(pitch,reference):null;
  const gauge=offset==null?'':'<div class="pitch-line" aria-hidden="true"><i style="left:'+Math.min(100,Math.max(0,50+offset/2))+'%"></i></div><p>'+delta(pitch,reference)+' par rapport à la cible</p>';
  return '<div class="capture-card '+style+'" role="status"><div class="capture-top"><span>'+state+'</span><i class="capture-dot" aria-hidden="true"></i></div>'+
    (pitch==null?'':'<strong class="capture-value">'+formatPitch(pitch,mode)+'</strong>')+gauge+
    (confirmed||pitch==null?'':'<p>'+measurementStatus()+'</p>')+'</div>';
}
function lastLugFeedback(){
  if(!lugMeasurements.length)return '';
  return '<p class="last-capture">Vis '+lugMeasurements.length+' validée · '+formatPitch(lugMeasurements.at(-1),'lug')+'</p>';
}
function redrawMeasurement(action){
  show(view,false);
  screen.querySelector('[data-action="'+action+'"]')?.focus({preventScroll:true});
}
function lugStatus(index){
  const offset=cents(lugMeasurements[index],stepsForHead());
  if(offset < -12) return {kind:'up',symbol:'+'};
  if(offset > 12) return {kind:'down',symbol:'−'};
  return {kind:'ok',symbol:'✓'};
}
function recordLug(){
  const deviation=pass>=2?0:[-.29,0,.28][(lugIndex+pass+head)%3];
  const measured=simulateHit(stepsForHead()+deviation,lugIndex);
  if(measured==null) return false;
  lugMeasurements.push(measured);
  lugIndex++;
  resetMeasurement();
  return true;
}
function headView(mode){
  const drum=find(selected);
  const lugs=Array.from({length:drum.lugs},(_,index)=>{
    const angle=2*Math.PI*(index+.5)/drum.lugs-Math.PI/2;
    const x=50+44*Math.cos(angle);
    const y=43+37*Math.sin(angle);
    return {index,x,y,front:Math.sin(angle)>.22};
  });
  const rods=lugs.filter(lug=>lug.front).map(lug=>
    '<span class="head-rod" style="left:'+lug.x+'%;top:'+lug.y+'%" aria-hidden="true"></span>'
  ).join('');
  const markers=lugs.map(lug=>{
    const index=lug.index;
    const mark=mode==='result'?lugStatus(index):{kind:mode==='scan'?(index===lugIndex?'active':index<lugIndex?'done':''):'',symbol:index+1};
    return '<span class="lug '+mark.kind+'" style="left:'+lug.x+'%;top:'+lug.y+'%" aria-label="Vis '+(index+1)+', '+mark.symbol+'">'+mark.symbol+'</span>';
  }).join('');
  const caption=mode==='scan'?'Vis '+(lugIndex+1)+' sur '+drum.lugs:mode==='result'?'Réglages près des vis':'Peau vue du dessus';
  return '<div class="head"><div class="head-shell" aria-hidden="true"></div>'+rods+'<div class="skin"><strong>TomTune</strong><small>'+caption+'</small></div>'+markers+'</div>';
}
function metrics(ref, measured){
  return '<div class="metrics"><div class="metric"><small>Note de référence</small><strong>'+(ref==null?'À définir':note(ref))+'</strong></div><div class="metric"><small>Note mesurée</small><strong>'+measures(measured,ref)+'</strong></div></div>';
}
function drillName(){return head===0?'Peau de frappe':'Peau de résonance'}
function show(next, focus=true){
  view=next;
  screen.classList.toggle('kit-home',view==='home');
  screen.innerHTML=pages[view]();
  if(focus){window.scrollTo(0,0);screen.querySelector('h1, [data-kit]')?.focus({preventScroll:true})}
}
function startScan(nextHead, repeat=false){
  head=nextHead;
  pass=repeat?pass+1:0;
  lugIndex=0;
  resetMeasurement();
  lugMeasurements=[];
  show('scan');
}
const pages = {
  welcome:()=>title('Configure ton kit','Ajoute tes toms pour retrouver ta batterie sur ton téléphone.')+actions(btn('edit','Définir mon kit',true)),
  setup:()=>back('setup-back')+title('Configurer mon kit')+
    '<div class="fields">'+['rack','floor'].map(type=>'<label>'+labels[type]+'s<input type="number" min="0" step="1" inputmode="numeric" required data-count="'+type+'" value="'+draft.filter(d=>d.type===type).length+'"></label>').join('')+'</div>'+
    panel('<p class="fine">Les vis sont préremplies. Vérifie leur nombre sur chaque tom.</p>'+
    ['rack','floor','snare','kick'].flatMap(type=>draft.filter(d=>d.type===type).map(drum=>'<div class="element"><h2>'+label(drum)+'</h2><div class="fields"><label>Diamètre<select data-diameter="'+drum.id+'">'+opts(sizes[type],drum.diameter,x=>x+'″')+'</select></label>'+
    (isTom(drum)?'<label>Vis par peau<select data-lugs="'+drum.id+'">'+opts(Array.from({length:10},(_,index)=>index+3),drum.lugs)+'</select></label>':'')+'</div></div>')).join(''))+
    actions(btn('preview','Voir mon kit',true)),
  preview:()=>back('back-setup','Configuration')+title('Aperçu du kit')+stage(draft)+
    '<div id="name-kit" class="actions"><label class="stack">Nom du kit<input name="kitName" value="'+escapeText(draftName)+'" placeholder="Ex. Kit de répétition" required maxlength="60" enterkeyhint="done"></label><p class="form-error" role="alert" hidden></p>'+
    btn('save-kit','Enregistrer sur cet appareil',true)+'</div>',
  home:()=>kitToolbar()+stage(kit,true)+
    '<p class="fine muted kit-caption">Sélectionne un fût pour l’ouvrir.</p>'+
    (message?'<p class="fine" role="status">'+message+'</p>':''),
  drum:()=>{
    const drum=find(selected);
    return back('return',returnTo==='results'?'Bilan du contrôle':'Mon kit')+
      title(label(drum),isTom(drum)?(drum.tuned?'Accordage déjà effectué':'Aucun accordage guidé enregistré'):'Mesure du fût entier')+
      (isTom(drum)?headView('plain'):'')+metrics(drum.ref,drum.last)+
      (drum.lastTarget!=null && drum.lastTarget!==drum.ref ? '<p class="status">Cible du dernier accordage · '+note(drum.lastTarget)+'</p>' : '')+
      actions(isTom(drum)?btn('tune','Commencer l’accordage',true):'',btn('compare','Mesurer le fût entier'),btn('edit-ref','Modifier la note de référence'));
  },
  tuning:()=>back('drum')+title('Accorder · '+label(find(selected)))+
    panel('<label class="stack">Note cible du fût entier<select class="note" data-target>'+noteOptions(target)+'</select></label><p class="fine status">'+(find(selected).ref==null?'Suggestion pour ce tom.':'Référence enregistrée chargée.')+'</p>')+
    '<p>On commence par la peau de frappe. Aligne le repère TomTune avec le logo de ta peau, entre les deux vis du haut.</p>'+
    actions(btn('scan-start','Commencer par la peau de frappe',true)),
  scan:()=>back('drum',label(find(selected)))+title(drillName(),'Étape '+(head+1)+' sur 2 · Tour '+(pass+1))+
    '<p class="row"><span>Cible près des vis</span><strong>'+headFrequency()+'</strong></p>'+
    headView('scan')+
    '<p>Étouffe l’autre peau. Frappe doucement près de la vis en surbrillance, avec une baguette ou ton doigt.</p>'+
    feedbackCard({reference:stepsForHead(),mode:'lug'})+lastLugFeedback()+progress(lugIndex/find(selected).lugs)+
    actions(btn('lug-hit','Simuler une frappe',true),btn('lug-fast','Simuler les vis restantes')),
  adjustments:()=>back('drum',label(find(selected)))+title('Réglages · '+drillName(),'Cible près des vis · '+headFrequency())+
    headView('result')+lastLugFeedback()+'<p class="legend"><span>+ Serrer</span><span>− Desserrer</span><span>✓ Laisser</span></p>'+
    (pass<2?'<p>Si plusieurs vis sont à régler, procède par petits ajustements en alternant les vis opposées.</p>':'<p>Les mesures sont stables sur cette peau.</p>')+
    actions(btn('repeat','Vérifier cette peau',true),btn('next-head',head===0?'Passer à la peau de résonance':'Vérifier le fût entier')),
  whole:()=>{
    const drum=find(selected);
    return back('drum',label(drum))+title('Vérifier le fût entier','Frappe au centre et laisse les deux peaux résonner. Cible · '+note(target))+
    feedbackCard({reference:target,measured:sessionMeasure})+
    (sessionMeasure==null?'':('<p class="status">'+(Math.abs(cents(sessionMeasure,target))>=20?'Écart significatif. Tu peux refaire une passe.':'Mesure stable proche de la cible.')+'</p>'))+
    actions(sessionMeasure==null?btn('whole-hit','Simuler une frappe',true):btn('finish','Terminer l’accordage',true),
      sessionMeasure!=null?btn('correction','Refaire une passe de correction'):'',
      sessionMeasure!=null && target!==drum.ref?btn('finish-reference','Terminer et enregistrer la cible comme référence'):'');
  },
  compare:()=>{
    const drum=find(selected);
    return back('drum',label(drum))+title('Mesurer · '+label(drum),'Frappe au centre et laisse les deux peaux résonner.'+(drum.ref==null?'':' Cible · '+note(drum.ref)))+
    feedbackCard({reference:drum.ref,measured:sessionMeasure})+
    actions(btn('compare-hit',sessionMeasure==null?'Simuler une frappe':'Refaire une mesure',true));
  },
  references:()=>back('home','Mon kit')+title('Notes de référence','Les notes de tes fûts joués avec les deux peaux libres.')+
    '<div class="list">'+kit.map(drum=>btn('reference',label(drum)+' · '+(drum.ref==null?'À définir':note(drum.ref)),false,drum.id)).join('')+'</div>',
  reference:()=>{
    const drum=find(selected);
    return back('reference-back')+title('Référence · '+label(drum))+
    '<label class="stack">Choisir une note<select data-ref class="note">'+noteOptions(refsDraft)+'</select></label>'+
    actions(btn('suggest','Utiliser la suggestion · '+note(suggest(drum))),btn('record-ref','Mesurer le fût entier'))+
    panel('<h2>Note à enregistrer</h2><strong>'+note(refsDraft)+'</strong>')+
    actions(btn('save-ref','Enregistrer la référence',true));
  },
  capture:()=>back('back-ref')+title('Capturer une note','Frappe au centre et laisse les deux peaux résonner.')+
    feedbackCard({measured:captureMeasure})+
    actions(readDraft==null?btn('capture-hit','Simuler une frappe',true):btn('capture-use','Utiliser cette note',true)),
  check:()=>{
    const drum=order[checkIndex];
    return back('home','Mon kit')+title('Contrôle de l’accordage')+
      '<p>Fût '+(checkIndex+1)+' sur '+order.length+'</p>'+progress(checkIndex/order.length)+
      panel('<h2>'+label(drum)+'</h2><p>Frappe au centre et laisse le fût résonner.</p><p>Référence · '+(drum.ref==null?'À définir':note(drum.ref))+'</p>')+feedbackCard({reference:drum.ref})+
      (previousCheck?'<p class="last-capture">'+previousCheck.label+' validé · '+formatPitch(previousCheck.pitch,'drum')+'</p>':'')+
      actions(btn('check-hit','Simuler une frappe',true),btn('check-skip','Passer ce fût'));
  },
  results:()=>back('home','Mon kit')+title('Bilan du contrôle','Dans la vue du kit, chaque paire indique la référence puis la note mesurée.')+stage(kit,true,true)+
    order.map(drum=>{
      const current=find(drum.id);
      const measured=checked[current.id];
      const needsTuning=measured!=null && current.ref!=null && Math.abs(cents(measured,current.ref))>=20;
      return '<div class="result"><strong>'+label(current)+'</strong><p>Référence · '+(current.ref==null?'À définir':note(current.ref))+
        '</p><p>Mesure · '+(measured==null?'Fût passé':measures(measured,current.ref))+'</p>'+
        (needsTuning&&isTom(current)?btn('tune-from-results','Accorder ce tom',false,current.id):'')+'</div>';
    }).join('')+actions(btn('check','Refaire le contrôle',true))
};
function openDrum(id, origin){
  selected=id;
  returnTo=origin;
  show('drum');
}
function newReference(origin){
  from=origin;
  const drum=find(selected);
  refsDraft=drum.ref??suggest(drum);
  show('reference');
}
function finish(updateReference){
  const drum=find(selected);
  drum.tuned=true;
  drum.last=sessionMeasure;
  drum.lastTarget=target;
  if(updateReference) drum.ref=target;
  if(returnTo==='results') checked[selected]=sessionMeasure;
  save();
  show('drum');
}
function advanceCheck(measured){
  const drum=order[checkIndex];
  checked[drum.id]=measured;
  previousCheck=measured==null?null:{label:label(drum),pitch:measured};
  if(measured!=null){find(drum.id).last=measured;save()}
  checkIndex++;
  resetMeasurement();
  show(checkIndex===order.length?'results':'check');
}
const handlers={
  fresh:()=>{kit=null;currentKitId=null;demoMode=false;message='';show('welcome')},
  demo:()=>{
    kit=initialKit();
    kit.splice(1,0,makeDrum('rack',2,12));
    demoMode=true;
    kit.forEach((drum,index)=>{drum.ref=suggest(drum);drum.last=drum.ref+(index%2?.31:-.11);drum.tuned=isTom(drum)});
    message='Kit d’exemple chargé.';
    show('home');
  },
  edit:()=>editKit(),
  'new-kit':()=>editKit(true),
  'setup-back':()=>show(setupBack),
  'back-setup':()=>show('setup'),
  'save-kit':saveNamedKit,
  preview:()=>{
    const invalid=screen.querySelector('[data-count]:invalid');
    if(invalid){invalid.reportValidity();return}
    show('preview');
  },
  home:()=>{message='';show('home')},
  'open-drum':id=>openDrum(id,view==='results'?'results':'home'),
  return:()=>show(returnTo),
  drum:()=>show('drum'),
  tune:()=>{const drum=find(selected);target=drum.ref??suggest(drum);correctionRound=0;show('tuning')},
  'scan-start':()=>startScan(0),
  'lug-hit':()=>{
    if(!recordLug()){redrawMeasurement('lug-hit');return}
    if(lugIndex===find(selected).lugs)show('adjustments');
    else redrawMeasurement('lug-hit');
  },
  'lug-fast':()=>{
    while(lugIndex<find(selected).lugs) recordLug();
    show('adjustments');
  },
  repeat:()=>startScan(head,true),
  'next-head':()=>{
    if(head===0){startScan(1);return}
    resetMeasurement();
    sessionMeasure=null;
    show('whole');
  },
  'whole-hit':()=>{
    const base=target+(pass<2 && correctionRound===0 ? .24 : .08);
    sessionMeasure=simulateHit(base,1);
    if(sessionMeasure==null)redrawMeasurement('whole-hit');
    else show('whole');
  },
  correction:()=>{correctionRound++;startScan(0)},
  finish:()=>finish(false),
  'finish-reference':()=>finish(true),
  compare:()=>{resetMeasurement();sessionMeasure=null;show('compare')},
  'compare-hit':()=>{
    if(sessionMeasure!=null){handlers.compare();return}
    const drum=find(selected);
    sessionMeasure=simulateHit((drum.ref??suggest(drum))+.12,2);
    if(sessionMeasure==null){redrawMeasurement('compare-hit');return}
    drum.last=sessionMeasure;
    if(returnTo==='results') checked[selected]=sessionMeasure;
    save();
    show('compare');
  },
  references:()=>show('references'),
  reference:id=>{selected=id;newReference('references')},
  'edit-ref':()=>newReference('drum'),
  'reference-back':()=>show(from),
  'back-ref':()=>show('reference'),
  suggest:()=>{refsDraft=suggest(find(selected));show('reference')},
  'record-ref':()=>{resetMeasurement();readDraft=null;captureMeasure=null;show('capture')},
  'capture-hit':()=>{
    const measured=simulateHit(suggest(find(selected))-1,2);
    if(measured==null){redrawMeasurement('capture-hit');return}
    captureMeasure=measured;
    readDraft=Math.round(measured);
    show('capture');
  },
  'capture-use':()=>{refsDraft=readDraft;show('reference')},
  'save-ref':()=>{find(selected).ref=refsDraft;save();show(from)},
  check:()=>{
    order=[...kit].sort((a,b)=>{
      const rank={snare:0,rack:1,floor:1,kick:2};
      return rank[a.type]-rank[b.type] || a.diameter-b.diameter;
    });
    checked={};previousCheck=null;checkIndex=0;resetMeasurement();show('check');
  },
  'check-hit':()=>{
    const drum=order[checkIndex];
    const deviations=[.08,.32,-.12,-.39,.06,.23];
    const base=(drum.ref??suggest(drum))+deviations[checkIndex%deviations.length];
    const measured=simulateHit(base,checkIndex);
    if(measured==null)redrawMeasurement('check-hit');
    else advanceCheck(measured);
  },
  'check-skip':()=>advanceCheck(null),
  'tune-from-results':id=>{selected=id;returnTo='results';handlers.tune()}
};
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');
  if(button)handlers[button.dataset.action](button.dataset.value);
});
screen.addEventListener('change',event=>{
  const field=event.target;
  const val=Number(field.value);
  if(field.dataset.count && field.checkValidity() && Number.isSafeInteger(val)){
    setCount(field.dataset.count,val);
    // Refresh the configuration rows with the live input left in place.
    const updated=document.createElement('template');
    updated.innerHTML=pages.setup();
    screen.querySelector('.panel').replaceWith(updated.content.querySelector('.panel'));
  }
  if(field.hasAttribute('data-kit')){
    const entry=kits.find(item=>item.id===field.value);
    if(entry){
      currentKitId=entry.id;
      kit=entry.drums;
      demoMode=false;
      message='';
      save();
      show('home');
    }
  }
  if(field.dataset.diameter){
    const drum=draft.find(item=>item.id===field.dataset.diameter);
    drum.diameter=val;drum.lugs=defaultLugs(val);drum.ref=null;drum.last=null;drum.lastTarget=null;drum.tuned=false;
    show('setup',false);
  }
  if(field.dataset.lugs)draft.find(item=>item.id===field.dataset.lugs).lugs=val;
  if(field.hasAttribute('data-target'))target=val;
  if(field.hasAttribute('data-ref')){refsDraft=val;show('reference',false);screen.querySelector('[data-ref]').focus()}
});
screen.addEventListener('input',event=>{
  if(event.target.name==='kitName')draftName=event.target.value;
});
function saveNamedKit(){
  const field=screen.querySelector('input[name="kitName"]');
  const error=screen.querySelector('#name-kit .form-error');
  const name=field.value.trim();
  const duplicate=kits.some(entry=>entry.id!==editingKitId && entry.name.toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr'));
  if(!name || duplicate){
    error.textContent=duplicate?'Un kit porte déjà ce nom.':'Saisis un nom pour ce kit.';
    error.hidden=false;
    field.focus();
    return;
  }
  currentKitId=editingKitId??'kit-'+(kits.length+1);
  const entry={id:currentKitId,name,drums:draft};
  const index=kits.findIndex(item=>item.id===currentKitId);
  if(index===-1)kits.push(entry);
  else kits[index]=entry;
  kit=entry.drums;
  demoMode=false;
  message=save()?'Kit enregistré sur cet appareil.':'Kit ajouté. Il sera disponible pendant cette session.';
  show('home');
}
screen.addEventListener('keydown',event=>{
  if(event.key==='Enter' && !event.isComposing && event.target.name==='kitName'){
    event.preventDefault();
    saveNamedKit();
  }
});
show(view,false);
</script>
</body>
</html>
